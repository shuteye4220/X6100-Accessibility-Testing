name: Build image
on:
  workflow_dispatch:
  push:
    # Pattern matched against refs/tags
    tags:
      - '**'           # Push events to every tag
    # Fork test builds: a push to this branch builds and releases too.
    branches:
      - accessibility-additions-build
      - espeak-build

jobs:
  build:
    runs-on: ubuntu-22.04
    # Needed for the Release step below - without this the default
    # GITHUB_TOKEN is read-only and release creation fails with
    # "403 Resource not accessible by integration".
    permissions:
      contents: write
    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        tool-cache: false

        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: true
    - name: check free space
      run: |
        df -h
        pwd
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout GUI
      uses: actions/checkout@v4
      with:
        submodules: true
        path: x6100_gui

    - name: Checkout buildroot
      uses: actions/checkout@v4
      with:
        submodules: true
        repository: OpenX6100/AetherX6100Buildroot
        path: AetherX6100Buildroot

    - name: Patch GUI mk
      run: |
        # The package's site was gdyuldin's repository until 2026-10-16,
        # OpenX6100's since: point either at this checkout.
        sed -i -E "s,https://github.com/(gdyuldin|OpenX6100)/x6100_gui,${GITHUB_WORKSPACE}/x6100_gui,g" AetherX6100Buildroot/br2_external/package/x6100-gui/x6100_gui.mk
        grep -q "^X6100_GUI_SITE = ${GITHUB_WORKSPACE}/x6100_gui" AetherX6100Buildroot/br2_external/package/x6100-gui/x6100_gui.mk
        sed -i "s,^X6100_GUI_SITE_METHOD = git,X6100_GUI_SITE_METHOD = local,g" AetherX6100Buildroot/br2_external/package/x6100-gui/x6100_gui.mk
        sed -i "s,^X6100_GUI_GIT_SUBMODULES,# X6100_GUI_GIT_SUBMODULES,g" AetherX6100Buildroot/br2_external/package/x6100-gui/x6100_gui.mk

    # Test builds: the radio's web pages from the fork's accessibility
    # branch (shuteye4220/x6100_webserver, wcag-conformance) in place of
    # OpenX6100's v0.0.4.
    - name: Web pages from the accessibility branch
      run: |
        mk=AetherX6100Buildroot/br2_external/package/x6100-webserver/x6100_webserver.mk
        sed -i -e "s,^X6100_WEBSERVER_VERSION = .*,X6100_WEBSERVER_VERSION = e51fe62a22863042d971a22b0fe6fbaff8e2441a," \
               -e "s,^X6100_WEBSERVER_SITE = .*,X6100_WEBSERVER_SITE = https://github.com/shuteye4220/x6100_webserver," $mk
        grep -q "^X6100_WEBSERVER_VERSION = e51fe62a22863042d971a22b0fe6fbaff8e2441a$" $mk
        grep -q "^X6100_WEBSERVER_SITE = https://github.com/shuteye4220/x6100_webserver$" $mk

    # The image only ships SLT by default even though voice.cpp already
    # supports switching to Lyubov/Alan/Evgeniy too - this actually enables
    # the voice data for the ones the app already knows about.
    - name: Enable additional RHVoice voices
      run: |
        cat >> AetherX6100Buildroot/br2_external/configs/X6100_defconfig << 'EOF'
        BR2_PACKAGE_RHVOICE_ALAN=y
        BR2_PACKAGE_RHVOICE_BDL=y
        BR2_PACKAGE_RHVOICE_CLB=y
        BR2_PACKAGE_RHVOICE_ENGENIY_EN=y
        BR2_PACKAGE_RHVOICE_LYUBOV=y
        EOF

    # zram: compressed swap in memory (system/zram). Kernel options, and
    # a start-up script that makes the swap at boot.
    - name: zram compressed swap
      run: |
        B=AetherX6100Buildroot/br2_external/board/X6100/linux
        echo >> $B/sun8i-r16-x6100_defconfig
        cat x6100_gui/system/zram/linux.config >> $B/sun8i-r16-x6100_defconfig
        install -D -m 755 x6100_gui/system/zram/S05zram $B/rootfs-overlay/etc/init.d/S05zram
        grep -q "^CONFIG_ZRAM=y$" $B/sun8i-r16-x6100_defconfig
        test -x $B/rootfs-overlay/etc/init.d/S05zram

    # The speech engine: eSpeak (voice_synth_espeak.cpp) in place of
    # RHVoice. Buildroot's espeak package only installs onto the target,
    # so it also gets a staging install, for x6100-gui to build against.
    - name: Speech engine eSpeak
      run: |
        BR=AetherX6100Buildroot
        echo "BR2_PACKAGE_ESPEAK=y" >> $BR/br2_external/configs/X6100_defconfig

        mk=$BR/buildroot/package/espeak/espeak.mk
        sed -i '/^\$(eval \$(generic-package))$/d' $mk
        printf '%s\n' '' 'ESPEAK_INSTALL_STAGING = YES' 'define ESPEAK_INSTALL_STAGING_CMDS' \
          '	$(TARGET_MAKE_ENV) $(MAKE) -C $(@D)/src $(TARGET_CONFIGURE_OPTS) \' \
          '		AUDIO="$(ESPEAK_AUDIO_BACKEND)" DESTDIR="$(STAGING_DIR)" install' \
          'endef' '' '$(eval $(generic-package))' >> $mk

        gm=$BR/br2_external/package/x6100-gui/x6100_gui.mk
        sed -i 's/^\(X6100_GUI_DEPENDENCIES = .*\)$/\1 espeak\nX6100_GUI_CONF_OPTS += -DX6100_TTS=espeak/' $gm

        # Stop now, not two hours on, if any of that didn't take.
        grep -q "^ESPEAK_INSTALL_STAGING = YES" $mk
        grep -q '^\$(eval \$(generic-package))$' $mk
        grep -q "^X6100_GUI_DEPENDENCIES = .* espeak$" $gm
        grep -q "^X6100_GUI_CONF_OPTS += -DX6100_TTS=espeak$" $gm
        tail -n 8 $mk; grep "^X6100_GUI_\(DEPENDENCIES\|CONF_OPTS\)" $gm

    # Ccache
    - name: Ccache cache files
      uses: actions/cache@v4
      with:
        path: ~/.buildroot-ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          Linux-ccache-${{ github.sha }}
          Linux-ccache-
          ${{ runner.os }}-ccache-

    # Configure
    - name: Configure
      run: |
        cd AetherX6100Buildroot && bash ./br_config.sh

    # Build
    - name: Build
      run: |
        cd AetherX6100Buildroot/build
        make lame
        make mpg123
        make libsndfile-dirclean
        # On failure, the errors become annotations, readable through the
        # API where the full log can't be fetched.
        set -o pipefail
        if ! make 2>&1 | tee "$RUNNER_TEMP/build.log"; then
          df -h . | tail -1 | sed 's/^/::error title=Disk::/'
          grep -E "error:|Error [0-9]|No space left|undefined reference|ERROR:|failed" "$RUNNER_TEMP/build.log" \
            | grep -v "^ *#" | tail -n 8 | cut -c1-900 | sed 's/^/::error::/'
          tail -n 40 "$RUNNER_TEMP/build.log" | cut -c1-300 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' \
            | sed 's/^/::error title=Last lines::/'
          exit 1
        fi

    - name: Go for Pat
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: false

    - name: Node for Pat's web page
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # Test builds: the Winlink window's programs (dialog_winlink.c), built
    # for the radio after the system, with its compiler and libraries, then
    # put in the image: xara (VARA HF modem; HF, PulseAudio, the registered
    # speeds for VARA licence holders) and Pat (Winlink client).
    - name: Winlink programs (xara, Pat)
      run: |
        set -euo pipefail
        BR=$GITHUB_WORKSPACE/AetherX6100Buildroot/build
        CC=$(ls $BR/host/bin/*-linux-gnueabihf-gcc | grep -v br_real | head -n 1)
        SYSROOT=$($CC -print-sysroot)
        echo "compiler $CC, sysroot $SYSROOT"

        fail() { echo "::error title=Winlink programs::$1"; exit 1; }

        # xara, pinned to its release
        git clone -q --depth 1 --branch v0.1.1 https://github.com/x0rro/xara "$RUNNER_TEMP/xara"
        rustup update stable --no-self-update >/dev/null
        rustup target add armv7-unknown-linux-gnueabihf
        export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=$CC
        export RUSTFLAGS="-C target-cpu=cortex-a7 -C link-arg=--sysroot=$SYSROOT -C link-arg=-Wl,-rpath-link,$SYSROOT/usr/lib/pulseaudio"
        cargo build -q --manifest-path "$RUNNER_TEMP/xara/Cargo.toml" --locked --release \
          --target armv7-unknown-linux-gnueabihf -p xara --bin xara \
          --no-default-features --features pulse,registered 2>&1 | tail -n 30 \
          || fail "xara did not build"
        XARA=$RUNNER_TEMP/xara/target/armv7-unknown-linux-gnueabihf/release/xara
        test -x "$XARA" || fail "xara did not build"
        install -m 755 "$XARA" "$BR/target/usr/bin/xara"

        # Pat, pinned to its release; plain Go, no C. Its web page with
        # the accessibility fixes (.github/pat/accessibility.patch), built
        # again from its sources as Pat's own build does.
        git clone -q --depth 1 --branch v1.0.0 https://github.com/la5nta/pat "$RUNNER_TEMP/pat"
        git -C "$RUNNER_TEMP/pat" apply "$GITHUB_WORKSPACE/x6100_gui/.github/pat/accessibility.patch" \
          || fail "Pat's web page fixes did not apply"
        (cd "$RUNNER_TEMP/pat/web" && npm ci --no-audit --no-fund >/dev/null \
          && NODE_OPTIONS=--openssl-legacy-provider npx webpack --mode=production --devtool=source-maps >/dev/null) \
          || fail "Pat's web page did not build"
        grep -q 'aria-label="Connect URL"' "$RUNNER_TEMP/pat/web/dist/index.html" || fail "Pat's web page lacks the fixes"
        (cd "$RUNNER_TEMP/pat" && CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 \
          go build -trimpath -ldflags "-s -w" -o "$BR/target/usr/bin/pat" .) || fail "Pat did not build"

        file "$BR/target/usr/bin/xara" "$BR/target/usr/bin/pat"
        file "$BR/target/usr/bin/xara" | grep -q "ARM" || fail "xara is not an ARM program"
        file "$BR/target/usr/bin/pat" | grep -q "ARM" || fail "Pat is not an ARM program"

        # The image again, with them in it
        cd "$BR" && make 2>&1 | tail -n 20

    # Replace U-boot
    - name: Replace u-boot
      run: |
        dd if=x6100_gui/u-boot/u-boot-sunxi-with-spl.bin of=AetherX6100Buildroot/build/images/sdcard.img seek=8K bs=1 conv=notrunc

    # Compress image
    - name: Compress image
      run: |
        cd AetherX6100Buildroot/build/images
        zip sdcard.img.zip sdcard.img

    # Fixed filename (not tag-based) so a permanent download link
    # (github.com/.../releases/latest/download/sdcard.img.zip) always
    # works without needing to be updated for each new release.
    - name: 'Upload image'
      uses: actions/upload-artifact@v4
      with:
        name: sdcard.img.zip
        path: AetherX6100Buildroot/build/images/sdcard.img.zip

    # Create release
    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: AetherX6100Buildroot/build/images/sdcard.img.zip

    # A branch build makes its own tag and pre-release, one per run.
    - name: Release (branch build)
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/heads/')
      with:
        tag_name: ${{ github.ref_name == 'espeak-build' && 'espeak' || 'additions' }}-${{ github.run_number }}
        name: ${{ github.ref_name == 'espeak-build' && 'eSpeak' || 'Accessibility additions' }} test build ${{ github.run_number }}
        target_commitish: ${{ github.sha }}
        prerelease: true
        files: AetherX6100Buildroot/build/images/sdcard.img.zip
